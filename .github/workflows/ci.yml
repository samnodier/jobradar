name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobradar_test
          POSTGRES_PASSWORD: jobradar_test
          POSTGRES_DB: jobradar_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobradar_test -d jobradar_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://jobradar_test:jobradar_test@127.0.0.1:55432/jobradar_test?sslmode=disable
      TEST_REDIS_ADDR: 127.0.0.1:56379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply migrations to the test database
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
          goose -dir sql/schema postgres "$TEST_DATABASE_URL" up
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Unit and integration tests
        # Packages share the integration database; serialize packages so fixture
        # cleanup and public-job triggers cannot interfere across suites.
        run: go test -race -p 1 ./cmd/... ./internal/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npx vitest run
      - run: npm run build-only

  publish:
    # Images are published only for main, and only after every test passes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Application image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobradar:main
            ghcr.io/${{ github.repository_owner }}/jobradar:${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrations
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobradar-migrate:main
            ghcr.io/${{ github.repository_owner }}/jobradar-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
